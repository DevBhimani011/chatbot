services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    command: >
      etcd
      --advertise-client-urls=http://0.0.0.0:2379
      --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd_data:/etcd
    networks:
      - chatbot-network

  minio:
    image: minio/minio:RELEASE.2024-01-11T07-46-16Z
    container_name: milvus-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - chatbot-network

  milvus:
    image: milvusdb/milvus:v2.4.3
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - chatbot-network

  attu:
    image: zilliz/attu:latest
    container_name: milvus-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3001:3000"
    depends_on:
      - milvus
    networks:
      - chatbot-network

  postgres:
    image: postgres:15
    container_name: chatbot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-chatbot_db}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot-network

  graphql-engine:
    image: hasura/graphql-engine:v2.40.0
    container_name: chatbot-hasura
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-chatbot_db}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"your-secret-key-change-in-production-must-be-at-least-32-characters-long"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
    networks:
      - chatbot-network

  redis:
    image: redis:alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatbot-network

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: chatbot-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - chatbot-network

  backend:
    build:
      context: ./backend
    container_name: chatbot-backend
    volumes:
      - ./backend:/app
      # Map hugginface cache to host, so model download persists across rebuilds
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    environment:
      # Database
      - DB_HOST=postgres
      - DB_NAME=chatbot_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=chatbot-documents
      # Milvus
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # RabbitMQ
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # Groq
      - GROK_API_KEY=${GROK_API_KEY}
      - GROK_API_URL=https://api.groq.com/openai/v1/chat/completions
      - GROK_MODEL=llama-3.3-70b-versatile
      # Auth
      - SECRET_KEY=your-secret-key-change-in-production-must-be-at-least-32-characters-long
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chatbot_db
    depends_on:
      - postgres
      - milvus
      - minio
      - redis
    networks:
      - chatbot-network
    restart: always

  # Chat Worker - Handles chat messages from chat_queue
  # Single instance is sufficient for chat processing
  chat-worker:
    build:
      context: ./backend
    command: python run_chat_worker.py
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
    environment:
      # Database
      - DB_HOST=postgres
      - DB_NAME=chatbot_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=chatbot-documents
      # Milvus
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # RabbitMQ
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # Groq
      - GROK_API_KEY=${GROK_API_KEY}
      - GROK_API_URL=https://api.groq.com/openai/v1/chat/completions
      - GROK_MODEL=llama-3.3-70b-versatile
      # Auth
      - SECRET_KEY=your-secret-key-change-in-production-must-be-at-least-32-characters-long
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chatbot_db
    depends_on:
      - postgres
      - milvus
      - minio
      - redis
      - rabbitmq
      - backend
    networks:
      - chatbot-network
    restart: always

  # Document Worker - Handles PDF processing from pdf_queue
  # Fixed 5 workers for parallel PDF processing
  document-worker:
    build:
      context: ./backend
    command: python run_document_worker.py
    deploy:
      replicas: 5  # Fixed 5 workers for PDF processing
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
    environment:
      # Database
      - DB_HOST=postgres
      - DB_NAME=chatbot_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=chatbot-documents
      # Milvus
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # RabbitMQ
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # Groq
      - GROK_API_KEY=${GROK_API_KEY}
      - GROK_API_URL=https://api.groq.com/openai/v1/chat/completions
      - GROK_MODEL=llama-3.3-70b-versatile
      # Auth
      - SECRET_KEY=your-secret-key-change-in-production-must-be-at-least-32-characters-long
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chatbot_db
    depends_on:
      - postgres
      - milvus
      - minio
      - redis
      - rabbitmq
      - backend
    networks:
      - chatbot-network
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://192.168.3.160:8000
    container_name: chatbot-frontend
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - chatbot-network
    depends_on:
      - backend
    restart: always

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  redis_data:
  huggingface_cache:

networks:
  chatbot-network:
    driver: bridge
